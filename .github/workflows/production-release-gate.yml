name: Alwadi-Zatca Production Release Gate & CI/CD Pipeline

on:
  push:
    branches: [ master, main, feat/*, chore/*, fix/* ]
  pull_request:
    branches: [ master, main ]

jobs:
  quality-gate:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder_db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - name: Validate Prisma Schema
        run: npx prisma validate
      - name: Frontend Type Check
        run: npx tsc --noEmit
      - name: Backend Type Check
        run: npx tsc --noEmit -p tsconfig.server.json

  security-scan:
    name: Secret & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Gitleaks Secret Scanner
        run: gitleaks detect --verbose --config .gitleaks.toml
      - run: npm audit --audit-level=high || true

  test-suite:
    name: Unit, Integration & Isolation Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_alwadi_zatca
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_alwadi_zatca?schema=public"
      TEST_DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_alwadi_zatca?schema=public"
      JWT_SECRET: "ci-testing-jwt-secret-key-32-bytes-long!"
      ZATCA_SDK_PATH: "/tmp/zatca-sdk"
      NODE_ENV: "test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --accept-data-loss
      - run: npx vitest run --fileParallelism=false --reporter=verbose

  regional-compliance:
    name: Saudi Arabia Data Residency & Spec Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx tsx scripts/verify_saudi_region.ts config/alwadi-production-spec.json

  docker-build:
    name: Build & Verify Docker Image
    needs: [quality-gate, test-suite, regional-compliance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: alwadi-zatca:latest
